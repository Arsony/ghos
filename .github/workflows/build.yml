name: build

on:
  push:
  pull_request:

jobs:
  dsp-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Configure (tests only, no JUCE)
        run: cmake -S . -B build -DBLOODLINE_BUILD_PLUGINS=OFF -DCMAKE_BUILD_TYPE=Release
      - name: Build
        run: cmake --build build
      - name: Run offline engine tests
        run: ctest --test-dir build --output-on-failure

  ghost-vst3:
    needs: dsp-tests
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true
      - name: Configure
        run: cmake -S . -B build -DBLOODLINE_BUILD_TESTS=OFF
      - name: Build GHOST VST3
        run: cmake --build build --config Release --target Ghost_VST3
      - uses: actions/upload-artifact@v4
        with:
          name: GHOST-VST3-Windows
          path: build/Ghost/Ghost_artefacts/Release/VST3/GHOST.vst3
